name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release is named by its tag. If the tag says v0.9.0 but package.json
      # says 0.8.24, the published artifacts are mislabelled and the version
      # files have drifted. Fail here, before anything is built or uploaded.
      # The tag build is the last gate before a release is published.
      # Assert both tag-vs-package.json AND all 5 version files agree,
      # catching drift that slipped past PR CI (e.g. lockfile staleness).
      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag:          $GITHUB_REF_NAME (version $TAG_VERSION)"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag $GITHUB_REF_NAME implies $TAG_VERSION but package.json is $PKG_VERSION. Run: node scripts/bump-version.mjs $TAG_VERSION"
            exit 1
          fi

      - name: Assert all version files agree
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          CARGO_LOCK_VERSION=$(awk '/^name = "kerf"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' src-tauri/Cargo.lock)
          NPM_LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          NPM_LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          echo "package.json:            $PKG_VERSION"
          echo "tauri.conf.json:         $TAURI_VERSION"
          echo "Cargo.toml:              $CARGO_VERSION"
          echo "Cargo.lock (kerf):       $CARGO_LOCK_VERSION"
          echo "package-lock.json:       $NPM_LOCK_VERSION"
          echo "package-lock.json root:  $NPM_LOCK_ROOT_VERSION"
          if [ -z "$CARGO_LOCK_VERSION" ]; then
            echo "::error::Could not read the kerf package version from src-tauri/Cargo.lock"
            exit 1
          fi
          DRIFT=0
          for V in "$TAURI_VERSION" "$CARGO_VERSION" "$CARGO_LOCK_VERSION" "$NPM_LOCK_VERSION" "$NPM_LOCK_ROOT_VERSION"; do
            if [ "$V" != "$PKG_VERSION" ]; then DRIFT=1; fi
          done
          if [ "$DRIFT" != "0" ]; then
            echo "::error::Version drift detected. Run: node scripts/bump-version.mjs $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # The sim feature gates the GRBL simulator and the golden G-code corpus —
      # the safety net that catches machine-output regressions before a release.
      - run: cargo test --features sim
        working-directory: src-tauri

      - run: cargo clippy --all-targets --features sim -- -D warnings
        working-directory: src-tauri

  build-macos:
    needs: [test]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: kerf-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kerf-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: artifacts/**/*
          generate_release_notes: true
