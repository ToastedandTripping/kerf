[package]
name = "kerf"
version = "0.8.23"
edition = "2021"

[lib]
name = "kerf_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kerf"
path = "src/main.rs"

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4"
vtracer = "0.6"
visioncortex = "0.8"
image = "0.25"
imageproc = "0.25"
base64 = "0.22"
tiny-skia = "=0.12.0"
keepawake = "=0.6.0"
