[package]
name = "kerf"
version = "0.1.0"
edition = "2021"

[lib]
name = "kerf_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kerf"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4"
